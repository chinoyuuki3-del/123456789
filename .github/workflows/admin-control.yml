name: Troll Engine owner cloud control

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: troll-engine-cloud-control
  cancel-in-progress: false

jobs:
  update-cloud:
    if: github.actor == 'chinoyuuki3-del' && startsWith(github.event.issue.title, '[Troll Cloud管理]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate owner command
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/admin-control.py

      - name: Commit cloud data
        run: |
          git config user.name "Troll Engine Cloud Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Troll Engine Cloud管理更新"
          git push

      - name: Close command
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue comment "$ISSUE_URL" --body "オーナー操作をTroll Engine GitHub Cloudへ反映しました。端末側は約5秒ごとに確認します。"
          gh issue close "$ISSUE_URL" --reason completed
